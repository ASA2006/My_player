<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Web Player with Quality Selector</title>
    <!-- استدعاء مكتبة hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .player-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 700px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        input[type="text"] {
            direction: ltr;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .status {
            font-size: 0.9em;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="player-card">
    <h2>مشغل HLS مع قائمة اختيار الجودات</h2>
    
    <!-- عنصر الفيديو -->
    <video id="video" controls autoplay></video>

    <div class="controls">
        <label for="streamUrl">رابط الماستر (.m3u8):</label>
        <input type="text" id="streamUrl" placeholder="https://your-worker.workers.dev/bein1" value="https://fancy-pine-4579.hmodehmode20202.workers.dev/bein1">
        
        <div class="row">
            <button onclick="loadStream()">تشغيل البث</button>
            <div style="flex-grow: 1;">
                <label for="qualitySelect" style="font-size: 0.85em; display: block; margin-bottom: 3px;">اختر الجودة:</label>
                <select id="qualitySelect" onchange="changeQuality(this.value)">
                    <option value="-1">تلقائي (Auto)</option>
                </select>
            </div>
        </div>
        
        <div id="status" class="status">جاهز للتشغيل...</div>
    </div>
</div>

<script>
    let hls;
    const video = document.getElementById('video');
    const statusText = document.getElementById('status');
    const qualitySelect = document.getElementById('qualitySelect');

    function loadStream() {
        const url = document.getElementById('streamUrl').value.trim();

        if (!url) {
            alert('يرجى إدخال رابط البث أولاً!');
            return;
        }

        statusText.innerText = 'جاري تحميل البث...';

        if (hls) {
            hls.destroy();
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                statusText.innerText = 'تم تحميل البث بنجاح!';
                video.play().catch(e => console.log("Auto-play prevented:", e));
                
                // تعبئة قائمة الجودات تلقائياً من ملف الماستر
                populateQualities(data.levels);
            });

            hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                // تحديث مؤشر الجودة الحالية عند التغيير التلقائي أو اليدوي
                const levelIndex = data.level;
                if(levelIndex === -1) {
                    qualitySelect.value = "-1";
                } else {
                    qualitySelect.value = levelIndex;
                }
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            statusText.innerText = 'خطأ في الشبكة، جاري إعادة المحاولة...';
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            statusText.innerText = 'خطأ في الوسائط، جاري التعافي...';
                            hls.recoverMediaError();
                            break;
                        default:
                            statusText.innerText = 'فشل تشغيل البث.';
                            hls.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', function () {
                video.play();
                statusText.innerText = 'جاري التشغيل عبر المشغل الداخلي...';
            });
        } else {
            statusText.innerText = 'متصفحك لا يدعم تشغيل HLS.';
        }
    }

    // دالة لتعبئة قائمة الجودات في الـ Dropdown
    function populateQualities(levels) {
        qualitySelect.innerHTML = '<option value="-1">تلقائي (Auto)</option>';
        levels.forEach((level, index) => {
            let resolution = level.height ? `${level.height}p` : `جودة ${index + 1}`;
            let bitrate = level.bitrate ? ` (${Math.round(level.bitrate / 1024)} kbps)` : '';
            let option = document.createElement('option');
            option.value = index;
            option.text = `${resolution}${bitrate}`;
            qualitySelect.appendChild(option);
        });
    }

    // دالة لتغيير الجودة يدوياً عند اختيارها من القائمة
    function changeQuality(newLevelIndex) {
        if (hls) {
            hls.currentLevel = parseInt(newLevelIndex);
            if (newLevelIndex == -1) {
                statusText.innerText = 'تم التحويل إلى الوضع التلقائي (Auto)';
            } else {
                statusText.innerText = `تم تثبيت الجودة على مستوى رقم ${newLevelIndex}`;
            }
        }
    }

    window.onload = function() {
        loadStream();
    };
</script>

</body>
</html>
